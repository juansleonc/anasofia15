name: dojo
version: 1
description: dojo workflow - proposal -> specs -> design -> tasks -> verify-report
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal establishing why the change is needed
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      If `investigations/<change>/architecture.md` exists, read it first — it maps the
      CURRENT system (components, write paths, callers, invariants) and grounds this
      proposal in what actually exists today, not assumption.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this
      solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new capabilities,
      modifications, or removals. Mark breaking changes with **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names.
        - **Modified Capabilities**: existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes. Each needs a delta spec file.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      - **Lane**: why this change is NOT a fast-path (more than one behavior, or it
      crosses a boundary that needs a design) — this section is what justifies opening
      an OpenSpec change at all.


      The Capabilities section is the contract between proposal and specs: every
      capability listed here needs a corresponding spec file. Keep the document
      concise and focused on WHY, not HOW — implementation detail belongs in design.md.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Scenario-driven specifications — the contracts for this change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do. Each
      Given/When/Then scenario below IS the contract for this change: it is what
      later phases implement against and what verify grades evidence against.


      Create one spec file per capability listed in the proposal's Capabilities
      section (new capabilities use the proposal's kebab-case name; modified
      capabilities use the existing spec folder name under `openspec/specs/`).


      Delta operations (use `##` headers): **ADDED Requirements**, **MODIFIED
      Requirements**, **REMOVED Requirements** (with **Reason** and **Migration**),
      **RENAMED Requirements** (FROM:/TO:).


      Format requirements:

      - Each requirement: `### Requirement: <name>` with SHALL/MUST language.

      - Each scenario: `#### Scenario: <ID>: <name>` — exactly four hashtags — followed
      by **GIVEN**/**WHEN**/**THEN** lines. Every requirement needs at least one
      scenario.

      - The scenario ID regex is `^[A-Z]{2,6}-[0-9]{3}$`: a 2-6 letter capability
      prefix, a hyphen, and a zero-padded 3-digit ordinal (e.g. a capability
      abbreviation plus `-001`). IDs are STABLE: never renumber one, and never reuse a
      retired ID for a different scenario — a later reader (or the verify-report
      matrix) must be able to trust that an ID always names the same scenario.


      **MODIFIED Requirements = full-block copy, not a diff.** Before writing a `##
      MODIFIED Requirements` entry: locate the existing requirement in
      `openspec/specs/<capability>/spec.md`, copy the ENTIRE requirement block (the
      requirement text plus ALL its scenarios) into the delta, THEN edit only what
      actually changes. A delta containing only the changed or added scenario reads as
      "this is the complete requirement" at sync/archive time — the rest of the
      original requirement is silently lost.


      End the file with a `## Adversarial Gate` section: for every scenario above,
      name one way the system could satisfy it while the change is still wrong, and
      say which scenario (by ID) closes that gap. A gate with no gap named is not
      done.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design — decisions, fragility, and scenario coverage
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      If `investigations/<change>/architecture.md` exists, read it first — decisions
      below must be grounded in the CURRENT system it maps, not assumption.


      Sections:

      - **Context**: background, current state, constraints.

      - **Goals / Non-Goals**: what this design achieves and explicitly excludes.

      - **Decisions**: key choices, each with the alternatives considered and why
      they were rejected.

      - **Risks**: known risks and trade-offs.

      - **Migration / Rollback**: deployment steps and rollback plan, if applicable.

      - **Fragility Notes**: the single MOST fragile assumption this design rests on —
      what it is, when it breaks, the consequence, and the mitigation. One assumption,
      not a list.

      - **Scenario Coverage**: one row per scenario ID from the specs phase, mapping
      it to the design element (component/decision) that satisfies it. Every scenario
      ID must appear here — a scenario with no design element is unaddressed and must
      be resolved before tasks are written.
    requires:
      - proposal
      - specs
  - id: tasks
    generates: tasks.md
    description: Ordered, scenario-mapped implementation checklist
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work. The apply phase
      parses checkbox format to track progress — a line not using `- [ ]` is never
      tracked.


      Each task line form: `- [ ] N.M <one behavior> — file: <path> · test: <path> ·
      scenarios: <ID>[, <ID>]`.


      Guidelines:

      - Group related tasks under `##` numbered headings.

      - One task = one testable behavior = one RED-then-GREEN cycle. A task that
      bundles two behaviors should be split.

      - Every task names at least one scenario ID from the specs phase — a task with
      no scenario named is not traceable to a contract.

      - Order tasks by dependency (what must be done first?).
    requires:
      - specs
      - design
  - id: verify-report
    generates: verify-report.md
    description: Scenario-to-executed-evidence matrix and sign-off
    template: verify-report.md
    instruction: >
      Create the report that grades every scenario against the evidence it actually
      has — not against whether its task is ticked. A tasks.md checkbox is never
      evidence on its own.


      Sections:

      - **Verdict**: `PASS` or `FAIL` for the change as a whole.

      - **Scenario Matrix**: one row per scenario ID, with the exact test or command
      that exercised it and the evidence level it earned. Evidence levels come from
      the ladder in `.claude/agents/validator.md` — cited here, never restated.

      - **Unverified**: surfaces that were not exercised (e.g. a declared impact/UX
      surface whose stack-adapter section is still TODO). Listing a surface here is
      never a silent pass.

      - **Evidence Basis**: the tree or commit this run was executed against. State
      explicitly that task ticks are not evidence.

      - **Sign-off**: who, and when. Left empty until the change is ready to archive.


      The Verdict is PASS only if every scenario ID in the matrix clears the pass bar
      in `.claude/agents/validator.md`'s evidence ladder — that file is the source of
      truth for which levels pass, cited here, never restated. A `blocked` grade from
      an environment failure never counts as a pass.
    requires:
      - tasks
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks one at a time (RED test, then
    GREEN implementation), mark each complete as you go. Pause if you hit a blocker
    or need clarification.
